# St. Luke's CKD Production Solution - Databricks Asset Bundle
# Deploy (reference/FEVM):        databricks bundle deploy -t dev
# Deploy (your own workspace):    fill in the `prod` target below, then  databricks bundle deploy -t prod
# See README.md → "Deploy in your own workspace" for the full step-by-step.
bundle:
  name: stlukes-ckd-production

include:
  - resources/*.yml

variables:
  catalog:
    description: Target Unity Catalog. NOTE - the pipeline/*.sql files currently hardcode slhs_test1.ckd_prod; this var is consumed by the train-model job. See README for retargeting the SQL.
    default: slhs_test1
  schema:
    description: Target schema.
    default: ckd_prod
  warehouse_id:
    description: A serverless / Pro SQL warehouse for SQL steps, the dashboard, and the app.
    default: 9946580e2a7f4dd1

targets:
  # ---- Reference build in the FEVM demo workspace ----
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-447340683886633.13.azuredatabricks.net
      profile: stlukes-workshop
    variables:
      catalog: slhs_test1
      schema: ckd_prod
      warehouse_id: 9946580e2a7f4dd1

  # ---- Template for deploying in YOUR OWN workspace (e.g. St. Luke's) ----
  # Fill in the four placeholders below, then: databricks bundle deploy -t prod
  # (You also retarget pipeline/*.sql + app/app.yaml — see README "Deploy in your own workspace".)
  prod:
    mode: production
    workspace:
      host: https://REPLACE-with-your-workspace-host        # e.g. https://your-org.cloud.databricks.com
      profile: REPLACE-with-your-cli-profile                # a profile from `databricks auth profiles`
    variables:
      catalog: REPLACE-with-your-catalog
      schema: ckd_prod
      warehouse_id: REPLACE-with-your-serverless-sql-warehouse-id
