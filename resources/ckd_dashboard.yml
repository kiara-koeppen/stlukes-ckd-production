# AI/BI dashboard (Lakeview) — "CKD Identification — Labs + Notes Fusion".
# The live demo dashboard was published manually; this resource captures it for reproducible
# redeploys (deploy creates a bundle-managed copy). JSON exported to ../dashboard/.
resources:
  dashboards:
    ckd_fusion_dashboard:
      display_name: "[${bundle.target}] CKD Identification — Labs + Notes Fusion"
      file_path: ../dashboard/ckd_labs_notes_fusion.lvdash.json
      warehouse_id: ${var.warehouse_id}
